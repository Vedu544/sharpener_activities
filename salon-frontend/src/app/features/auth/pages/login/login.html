<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 p-2  mt-[-30px]">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-4">
    <h2 class="text-3xl font-bold text-center mb-2 text-gray-900">Welcome Back</h2>
    <p class="text-center text-gray-600 text-sm mb-8">Sign in to your account to continue</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition"
        />
        <span *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched" class="text-red-500 text-xs mt-1 block">
          Email is required
        </span>
        <span *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched" class="text-red-500 text-xs mt-1 block">
          Please enter a valid email
        </span>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition"
        />
        <span *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-1 block">
          Password is required
        </span>
      </div>

      <p *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3">
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
        class="w-full bg-black text-white font-medium py-2.5 rounded-lg hover:bg-gray-800 disabled:bg-gray-400 disabled:cursor-not-allowed transition"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- Signup Section -->
    <div class="mt-5 pt-5 border-gray-200">
      <p class="text-center text-gray-600 text-sm mb-4">
        New to our platform?
      </p>
      <p class="text-center text-gray-600 text-sm mb-4">
        Create an account to get started and unlock all features
      </p>
      <button
        (click)="navigateToSignup()"
        class="w-full border-2 p-1 border-black text-black font-medium  rounded-lg hover:bg-purple-500 hover:text-white transition duration-200"
      >
        Create Account
      </button>
    </div>
  </div>
</div>
